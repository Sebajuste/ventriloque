[package]
name = "fabriquer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fabriquer"
path = "src/main.rs"

[dependencies]
hound = "3.5.1"
# Sans `sync` : la fabrication tient dans un seul fil, et la poignee CascLib n'est pas
# partageable entre fils. L'exiger obligerait a mentir sur `Sync`.
rhai = { version = "1.24.1", default-features = false, features = ["std", "only_i64"] }
symphonia = { version = "0.5.5", default-features = false, features = ["ogg", "vorbis"] }

[build-dependencies]
cc = "1.4.5"

[profile.release]
opt-level = 2
