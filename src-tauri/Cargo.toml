[package]
name = "ventriloque"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
hound = "3.5.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "blocking"] }
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = "2.0.0-rc"
specta-typescript = "0.0.12"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-specta = { version = "2.0.0-rc", features = ["typescript"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Registry"] }
zip = "8.6.0"

[build-dependencies]
cc = "1.4.5"
tauri-build = { version = "2", features = [] }
